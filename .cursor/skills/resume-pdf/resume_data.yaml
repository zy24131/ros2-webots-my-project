projects:
  - title: 智能动力底盘转向系统控制(国家重点研发计划子课题、国家农业重大项目子课题）
    period: 2024年09月 - 至今
    role: 电控负责人
    intro: ""
    blocks:
      - style: paragraph
        items:
          - 主导底盘转向系统运动学建模，采用机器人学经典的 D-H 参数法，针对转向拉杆、转向节、车轮定位参数等关键部件构建了精准的运动学模型。
          - 基于建立的运动学模型，成功推导并实现了"方向盘转角 - 转向半径 - 转向执行器转角"三者间的数学映射关系，明确了各物理量的量化关联逻辑，为后续控制算法设计奠定了坚实基础。
          - 独立完成液压阀控系统的理论分析，推导了液压动力学相关传递函数，并建立了符合实际硬件特性的算法仿真基础模型，为控制算法的有效性验证提供了可靠平台。
          - 利用 Simulink 的 C-function 自定义函数工具，将模式切换逻辑、PID 控制算法、传感器数据接收及控制指令发送逻辑高效集成到仿真模型中，完成了全流程功能验证，确保了算法的鲁棒性。
          - 基于 STM32F407 主控芯片，成功开发并实现了单阿克曼、双阿克曼、自转等多种运动模式的灵活切换，通过状态机设计，确保了不同模式间的平滑过渡与安全切换，满足了复杂场景下的运动控制需求。
          - 针对液压阀与编码器的通信特性，创新性地应用 CAN 滤波技术，有效解决了数据拥塞问题，成功打通了 8 路液压阀与编码器的双向数据链路，构建了稳定、低延迟的闭环控制数据通道。
          - 基于 PID 控制算法，为 8 路液压阀分别配置独立的控制参数与计算逻辑，通过批量计算、集中发送的优化策略，实现了多阀的精准协同控制，显著提升了多路阀联动的同步性与响应速度，有效保障了底盘运动的稳定性与操控精度。

  # ↓ 新增项目（格式同大模型中间件：总述 + 子模块 + 编号）
  - title: 面向复杂地形多轮腿式平台的 ROS2 运动控制中间件
    period: 2025年06月 - 2026年06月
    role: 学生负责人
    intro: >
      作为该项目核心成员，主导设计并实现基于 ROS2 Humble 的 L1~L3 分层运动控制栈，面向窄/宽轮距切换、
      多模式转向与原地自转，完成 Webots 仿真与真机可替换 IO 层统一架构，保障多模块协同下意图清晰、
      执行可追踪、命令链路单一。
    blocks:
      - subtitle: ROS2混合通信与接口设计
        style: numbered
        items:
          - 设计 Motion/Track 双域通信模型，Topic 承载连续控制流，Service 下发运动/轮距意图，Action 执行轮距切换长任务并反馈 progress，实现意图与执行分离。
          - 封装自定义消息层，建立话题与服务名称统一配置，Action 与 Service 类型分离，降低联调与重构成本。
      - subtitle: FSM状态机与Trigger调度
        style: numbered
        items:
          - 设计 case 0~5 显式 Trigger 驱动状态机，Service 存意图、FSM 判差后触发 Action，轮距切换失败自动回滚至稳定态。
          - 抽取 Action 客户端管理 goal 生命周期，FSM 主逻辑与通信细节解耦，便于扩展自转等后续模式。
      - subtitle: actuator_control执行与仲裁层
        style: numbered
        items:
          - 设计唯一 joint_commands 发布者，合并转向命令与 Action 插值命令，避免多节点争用执行器。
          - 内置 450ms 命令看门狗，方向盘输入超时后关节自动归零，保障仿真与真机运行安全。
      - subtitle: 业务节点与工程化
        style: numbered
        items:
          - 构建纯 C++ 运动学算法库与 steering_control 等 L2 节点，hardware_bridge 桥接 Webots/真机 IO，上层无需改动即可切换部署环境。
          - 统一 yaml 参数配置与 Launch 分层启动，提供一键编译运行 Webots 仿真的工程脚本。

  - title: 基于物理启发-神经网络动力学状态估计
    period: 2025年04月 - 2025年08月
    role: 学生负责人
    intro: ""
    blocks:
      - style: plain
        items:
          - 基于PINNS对车辆动力学进行建模，实现车辆部分的参数辨识，完成对轮速、转向角的预测与分析
          - 通过Ros开发，完成相关话题发布与节点创建，实现多传感器数据的采集与稳定传输
          - 采用小波变换方法对特定频率进行滤波处理，有效提升数据预处理质量
          - 设计mcu实时操作系统，完成数据收发、串口通信、车辆底层控制的模块化设计与实现

  - title: 面向丘陵山地农机的车载式分布式大模型推理中间件
    period: 2025年11月 - 2026年01月
    role: 学生负责人
    intro: >
      作为该项目核心成员，我专注于解决农机车载大模型与多模块协同中的通信、调度及任务管理难题，确保了系统的高可靠性和低延迟
      需求。
    blocks:
      - subtitle: 底层混合通信件
        style: numbered
        items:
          - 主导设计并实现基于ZMQ的多模式通信中间件，采用类简单工厂模式，适配丘陵山地农机车载大模型与多模块协同的高可靠、低延迟需求。通过精细化设计和优化通信策略，有效降低了业务层代码复杂度70%。
          - 实现了 PUB/SUB（传感器数据实时广播、指令下发）、PUSH/PULL（推理结果异步返回）、RPC（远程任务初始化与配置）等多种通信模式。系统根据不同业务场景选择对应通信策略，满足农机复杂场景下不同数据的传输需求。其中PUB/SUB 负责传感器数据广播与任务指令下发，保证实时性，PUSH/PULL 负责异步、可靠、点对点的推理结果回传，RPC 框架负责推理任务单元的远程创建、初始化、配置，支持节点动态注册
          - 开发了轻量级序列化协议，采用长度前缀+紧凑储存结构设计，实现了农机传感器参数的快速打包与解包。
      - subtitle: channel模块设计
        style: numbered
        items:
          - 统一管理底层多模式通信中间件的连接，实现丘陵山地农机多模块之间的实时数据链路。采用基于word_id的任务-通道映射表和基于pzmq类连接池技术，实现了分布式任务节点之间的通信管理功能。
          - 设计并应用观察者模式，实现了网络层和业务逻辑的有效解耦，提高了系统的可维护性和扩展性。
      - subtitle: 分布式任务调度框架设计
        style: numbered
        items:
          - 采用Reactor模式，设计了异步事件驱动的任务调度框架，通过eventpp实现高效的事件响应。
          - 实现了动态RPC服务注册，支持外部用户通过终端下发"初始化"、"暂停"和"信息查询"等指令，实现了灵活的远程调用。
          - 提供setup(初始化)等虚函数解耦，支持业务节点自定义任务处理逻辑（如坡地自动调平、障碍物规避路径生成、联合收割协同等），增强了框架的通用性和适应性。
      - subtitle: unit-manager模块
        style: numbered
        items:
          - 设计了多协议网关，实现了TCP/ZMQ协议转换，确保了外部用户与内部任务节点之间的顺畅通信交互。
          - 解析TCP的请求数据，实现了推理任务分发和服务注册分流，优化了任务处理流程。
          - 实现了线程安全的 KV 键值缓存，使用内存kv池储存和管理unit单元的信息，提高了数据访问效率和安全性。
      - subtitle: Node业务节点模块
        style: numbered
        items:
          - 实现了多任务实例管理，以及模型加载、推理、输出等核心机制，为车载大模型提供了完整的运行环境。

